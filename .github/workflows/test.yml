name: ptp-audit
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested MoonBit toolchain
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.15+943464bfa'
      - name: Check out the tested official Core revision
        uses: actions/checkout@v4
        with:
          repository: moonbitlang/core
          ref: eb321a18f7a33d37114546682a8d1cd6658afab8
          path: _build/toolchain-core
      - name: Bundle the matching standard library
        run: |
          rm -rf "$HOME/.moon/lib/core"
          mkdir -p "$HOME/.moon/lib/core"
          git -C _build/toolchain-core archive HEAD | tar -x -C "$HOME/.moon/lib/core"
          "$HOME/.moon/bin/moon" -C "$HOME/.moon/lib/core" bundle --warn-list -a --all
      - name: Run the complete local acceptance gates
        run: |
          python3 scripts/validate_local.py
          scripts/moon-local build --target all
          git diff --exit-code -- fixtures tests
          git diff --exit-code -- '*.mbti'
      - name: Verify documentation and submission sources
        run: python3 scripts/verify_delivery.py
      - name: Build and check a clean local delivery archive
        run: python3 scripts/package_local.py
      - name: Verify the compact registry archive outside ignored build paths
        run: python3 scripts/prepare_registry.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-acceptance-evidence
          path: |
            research/validation-0.3.0/
            _build/publish/package-audit-0.3.0.json
